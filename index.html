<index.html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Twentyoneesan Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
  <video class="header-video" autoplay muted loop playsinline preload="metadata">
    <source src="videos/header.mp4" type="video/mp4">
  </video>
  <div class="header-content">
    <h1>Twentyoneesan</h1>
    <p>Cosplay Gallery</p>
  </div>
  </header>

  <main>
    
      <section class="welcome">
      <span class="eyebrow">THE ART OF COSPLAY</span>
      <h2>Discover Beautiful Cosplay</h2>
      <p>A little collection of wonderful characters.</p>
      </section>

    <section class="gallery">

      <div class="gallery-heading">
        <div>
          <span class="eyebrow">OUR COLLECTION</span>
          <h2>Explore Gallery</h2>
        </div>
      </div>

      <div class="tools">
        <input
          type="search"
          id="searchInput"
          placeholder="Search character or Title..."
        >

        
<div class="categories" id="categoryButtons">
  <button class="category active" data-category="All">All</button>
  <button class="category" data-category="Favorites">♥ Favorites</button>
</div>

      </div>

      <div class="masonry" id="galleryGrid"></div>

      <p id="emptyMessage" class="empty-message" hidden>
        No photos found.
      </p>

    </section>

  </main>

  <footer>
    <p>© 2026 Twentyoneesan Gallery</p>
    <span>Made with appreciation for cosplay art.</span>

  <div class="social-links">
    <a href="https://www.tiktok.com/@twentyoneesan" target="_blank">TikTok</a>
    <a href="https://www.instagram.com/twentyoneesan" target="_blank">Instagram</a>
    <a href="https://t.me/twentyoneesann" target="_blank">Telegram</a>
  </div>

  </footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

  <button class="lightbox-close" id="closeLightbox">
    &times;
  </button>

  <div class="lightbox-content">
    <img id="lightboxImage" src="" alt="Cosplay preview">

    <div class="lightbox-info">
      <h2 id="lightboxTitle"></h2>
      <p id="lightboxArtist"></p>
    </div>
  </div>

</div>

  <script src="script.js"></script>

</body>
</html>
